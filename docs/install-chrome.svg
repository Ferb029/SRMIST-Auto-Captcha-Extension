<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
<rect width="900" height="420" rx="12" fill="#f4f5f7"/>
<rect x="0" y="0" width="900" height="44" rx="12" fill="#dfe3e8"/><rect x="0" y="30" width="900" height="14" fill="#dfe3e8"/>
<circle cx="22" cy="22" r="6" fill="#ef6a5e"/><circle cx="42" cy="22" r="6" fill="#f5bf4f"/><circle cx="62" cy="22" r="6" fill="#61c554"/>
<rect x="90" y="10" width="560" height="24" rx="12" fill="#fff"/><text x="106" y="27" font-size="14" fill="#333">chrome://extensions</text>
<text x="880" y="27" font-size="13" fill="#555" text-anchor="end">Google Chrome</text>
<rect x="20" y="60" width="860" height="56" rx="8" fill="#fff"/>
<text x="40" y="94" font-size="20" fill="#222" font-weight="600">Extensions</text>
<text x="640" y="94" font-size="15" fill="#333">Developer mode</text>
<rect x="770" y="80" width="40" height="20" rx="10" fill="#1a73e8"/><circle cx="800" cy="90" r="8" fill="#fff"/>
<rect x="628" y="74" width="194" height="32" rx="16" fill="none" stroke="#d93025" stroke-width="3"/>
<circle cx="836" cy="90" r="13" fill="#d93025"/><text x="836" y="95" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<rect x="20" y="126" width="860" height="44" rx="8" fill="#fff"/>
<rect x="36" y="134" width="130" height="28" rx="6" fill="#fff" stroke="#1a73e8"/><text x="101" y="153" font-size="14" fill="#1a73e8" text-anchor="middle">Load unpacked</text>
<rect x="30" y="130" width="142" height="36" rx="8" fill="none" stroke="#d93025" stroke-width="3"/>
<circle cx="186" cy="148" r="13" fill="#d93025"/><text x="186" y="153" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<rect x="20" y="180" width="420" height="110" rx="8" fill="#fff"/>
<rect x="36" y="196" width="40" height="40" rx="8" fill="#16a34a"/><text x="56" y="223" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">S</text>
<text x="90" y="212" font-size="16" fill="#222" font-weight="600">SRMIST Auto Captcha  1.0</text>
<text x="90" y="232" font-size="13" fill="#555">Fills the captcha on the SRM student portal login page.</text>
<rect x="370" y="250" width="44" height="24" rx="12" fill="#1a73e8"/><circle cx="402" cy="262" r="9" fill="#fff"/>
<text x="460" y="230" font-size="14" fill="#16a34a">After step 4 the extension appears here</text>
<circle cx="34" cy="300" r="10" fill="#d93025"/><text x="34" y="305" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="52" y="305" font-size="15" fill="#222">Open chrome://extensions</text>
<circle cx="34" cy="324" r="10" fill="#d93025"/><text x="34" y="329" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="52" y="329" font-size="15" fill="#222">Turn on Developer mode</text>
<circle cx="34" cy="348" r="10" fill="#d93025"/><text x="34" y="353" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="52" y="353" font-size="15" fill="#222">Click "Load unpacked"</text>
<circle cx="34" cy="372" r="10" fill="#d93025"/><text x="34" y="377" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<text x="52" y="377" font-size="15" fill="#222">Choose the unzipped folder (the one with manifest.json)</text>
</svg>